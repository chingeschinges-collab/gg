<div class="Popup__wrapper">
  <div
    class="panel Popup__content Dialog__popup_content show-dialog-animation"
    tabindex="-1"
  >
    <div class="Dialog__header">
      <div class="Dialog__title">
        <div class="Dialog__title_content">Нэвтрэх</div>
      </div>
      <div class="Dialog__top_actions">
        <div
          class="panel button SimpleButton SimpleButton_v_transparent SimpleButton_c_blue SimpleButton_use_icon Dialog__top_action close_button SimpleButton_interactive"
          tabindex="-1"
        >
          <div class="SimpleButton__content">
            <div
              class="panel Icon Icon_v_default Icon_c_white Icon_val_close_popup SimpleButton__icon Dialog__top_action_icon"
              tabindex="-1"
            >
              <div class="Icon__content"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="Dialog__content">
      <div
        class="scroll-panel"
        style="
          position: relative;
          height: 100%;
          width: 100%;
          overflow: hidden;
          touch-action: none;
        "
      >
        <div
          class="scroll-wrapper"
          style="transform: translate(0px, 0px) translateZ(0px)"
        >
          <div class="LoginContainer__content">
            <div class="LoginContainer__form_fields">
              <div
                class="panel FormField FormField_v_default FormField_c_light LoginContainer__form_field LoginContainer__input LoginContainer__username"
                tabindex="-1"
              >
                <div class="FormField__content">
                  <div class="FormField__control">
                    <div class="field-value-content-wrapper">
                      <input
                        name="username"
                        tabindex="0"
                        class="Input Input_v_rounded Input_c_blue"
                        placeholder="нэр"
                        type="text"
                        spellcheck="false"
                        keyboardtype=""
                        data-input-key=""
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="panel FormField FormField_v_default FormField_c_light LoginContainer__form_field LoginContainer__input LoginContainer__password password-field"
                tabindex="-1"
              >
                <div class="FormField__content">
                  <div class="FormField__control">
                    <div class="field-value-content-wrapper">
                      <input
                        name="password"
                        tabindex="0"
                        class="Input Input_v_rounded Input_c_blue"
                        placeholder="Нууц үг"
                        type="password"
                        spellcheck="false"
                        keyboardtype=""
                        data-input-key=""
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="panel FormField FormField_v_default FormField_c_light LoginContainer__form_field LoginContainer__checkbox LoginContainer__remember_me FormField_reverse FormField_useLabel"
                tabindex="-1"
              >
                <div class="FormField__content">
                  <div class="FormField__label">
                    <div class="FormField__label_text">Намайг сана</div>
                  </div>
                  <div class="FormField__control">
                    <div
                      class="panel Checkbox Checkbox_v_checkbox Checkbox_c_blue"
                      tabindex="0"
                    >
                      <div class="Checkbox__content">
                        <div
                          class="panel Icon Icon_v_default Icon_c_light Icon_val_ Checkbox__checkmark"
                          tabindex="-1"
                        >
                          <div class="Icon__content"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="panel Select Select_v_transparent Select_c_blue LanguageSelectorContainer LanguageSelectorContainer_v_default LanguageSelectorContainer_c_light LoginContainer__language Select_use_icon Select_use_arrow Select_use_checkbox selected"
              >
                <div class="Select__content">
                  <div class="panel button Select__button" tabindex="-1">
                    <div class="button-content">
                      <div
                        class="panel Icon Icon_v_default Icon_c_white Icon_val_flag_icon_mn Select__button_icon"
                        tabindex="-1"
                      >
                        <div class="Icon__content"></div>
                      </div>
                      <div class="Select__button_arrow"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="LoginContainer__buttons">
              <div
                class="panel button SimpleButton SimpleButton_v_flat SimpleButton_c_success_blue SimpleButton_use_text LoginContainer__action LoginContainer__sign_in_action SimpleButton_interactive"
                tabindex="0"
              >
                <div class="SimpleButton__content">
                  <div class="SimpleButton__text">НЭВТРЭХ</div>
                </div>
              </div>
              <div class="LoginContainer__social_buttons"></div>
              <div class="LoginContainer__bottom_buttons">
                <div class="LoginContainer__bottom_button">
                  <div
                    class="panel button SimpleButton SimpleButton_v_flat SimpleButton_c_secondary_blue SimpleButton_use_text LoginContainer__action LoginContainer__restore_password_action SimpleButton_interactive"
                    tabindex="0"
                  >
                    <div class="SimpleButton__content">
                      <div class="SimpleButton__text">НУУЦ ҮГЭЭ МАРТСАН?</div>
                    </div>
                  </div>
                </div>
                <div class="LoginContainer__bottom_button">
                  <div
                    class="panel button SimpleButton SimpleButton_v_flat SimpleButton_c_secondary_blue SimpleButton_use_text LoginContainer__action LoginContainer__sign_up_action SimpleButton_interactive"
                    tabindex="0"
                  >
                    <div class="SimpleButton__content">
                      <div class="SimpleButton__text">БҮРТГҮҮЛЭХ</div>
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="panel button SimpleButton SimpleButton_v_flat SimpleButton_c_secondary_blue SimpleButton_use_text LoginContainer__action LoginContainer__close_action SimpleButton_interactive"
                tabindex="0"
              >
                <div class="SimpleButton__content">
                  <div class="SimpleButton__text">Цуцлах</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          class="iScrollVerticalScrollbar iScrollLoneScrollbar"
          style="
            position: absolute;
            z-index: 9999;
            width: 7px;
            bottom: 2px;
            top: 2px;
            right: 1px;
            overflow: hidden;
            pointer-events: none;
            transform: translateZ(0px);
            transition-duration: 0ms;
            opacity: 0;
          "
        >
          <div
            class="iScrollIndicator"
            style="
              box-sizing: border-box;
              position: absolute;
              background: rgba(0, 0, 0, 0.5);
              border: 1px solid rgba(255, 255, 255, 0.9);
              border-radius: 3px;
              width: 100%;
              transition-duration: 0ms;
              display: none;
              height: 388px;
              transform: translate(0px, 0px) translateZ(0px);
            "
          ></div>
        </div>
      </div>
    </div>
  </div>
</div>
