<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
  :root{
    --bg:#1c1f26; --panel:#262b34; --panel2:#2e343f; --line:#3a4150;
    --text:#e7ebf1; --muted:#9aa3b2; --gold:#d4ac0d; --blue:#4db6e8;
    --green:#2e9e4f; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--line);
    padding:16px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .tag{color:var(--gold);font-weight:700}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 18px;display:grid;
    grid-template-columns:300px 1fr;gap:22px}
  @media (max-width:760px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:9px 11px;font-size:14px;outline:none}
  input:focus{border-color:var(--gold)}
  .seat-row{display:grid;grid-template-columns:26px 1fr 130px;gap:8px;align-items:center;margin-bottom:8px}
  .seat-row .num{color:var(--muted);font-size:12px;text-align:center}
  .seat-row input{padding:8px 10px}
  .btn{border:none;border-radius:7px;padding:10px 16px;font-size:14px;font-weight:600;
    cursor:pointer;color:#fff}
  .btn.save{background:var(--gold);color:#241d00}
  .btn.blue{background:var(--blue);color:#06222e}
  .btn.red{background:var(--red)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .row-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  #search{margin-bottom:10px}
  .tbl-list{list-style:none;margin:0;padding:0;max-height:60vh;overflow-y:auto}
  .tbl-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;
    background:var(--panel2);cursor:pointer;font-size:13px}
  .tbl-list li:hover{border-color:var(--gold)}
  .tbl-list li.active{border-color:var(--gold);background:#33383f}
  .tbl-list li .nm{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl-list li .dot{color:var(--gold);font-size:11px;flex:0 0 auto}
  .tbl-list li .plrs{color:var(--muted);font-size:12px;flex:0 0 auto;background:#1c2128;
    border:1px solid var(--line);border-radius:10px;padding:1px 8px}
  .empty{color:var(--muted);font-size:13px;padding:6px 2px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}

  /* Tabs */
  .tabs{display:flex;gap:4px;padding:14px 22px 0;border-bottom:1px solid var(--line);background:var(--panel)}
  .tab-btn{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
  .tab-panel{display:none}.tab-panel.active{display:block}
  .badge{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;margin-left:6px;vertical-align:middle}

  /* Contacts */
  .contacts-wrap{max-width:860px;margin:22px auto;padding:0 18px}
  .contact-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;position:relative}
  .contact-card.unread{border-left:3px solid var(--gold)}
  .contact-card .cc-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .contact-card .cc-kind{background:var(--blue);color:#06222e;font-size:11px;font-weight:700;padding:2px 10px;border-radius:12px}
  .contact-card .cc-name{font-weight:600;font-size:14px}
  .contact-card .cc-time{color:var(--muted);font-size:12px;margin-left:auto}
  .contact-card .cc-msg{color:var(--text);font-size:14px;line-height:1.6;white-space:pre-wrap}
  .contact-card .cc-ip{color:var(--muted);font-size:11px;margin-top:8px}
  .contact-card .cc-read-btn{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;font-size:11px;padding:3px 10px;cursor:pointer}
  .contact-card .cc-read-btn:hover{border-color:var(--gold);color:var(--gold)}
  .contacts-empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
  .contacts-toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center}
  .filter-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:6px 14px;font-size:13px;cursor:pointer}
  .filter-btn.active{border-color:var(--gold);color:var(--gold)}

  /* Accounts (Данс) */
  .acc-wrap{max-width:720px;margin:22px auto;padding:0 18px}
  .acc-form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:20px}
  .acc-form h2{font-size:14px;margin:0 0 14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .bank-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  @media(max-width:480px){.bank-picker{grid-template-columns:repeat(3,1fr)}}
  .bank-opt{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
  .bank-opt img{width:32px;height:32px;border-radius:7px;object-fit:cover}
  .bank-opt span{font-size:11px;color:var(--muted);line-height:1.2}
  .bank-opt.selected{border-color:var(--gold);background:#33382a}
  .bank-opt.selected span{color:var(--gold)}
  .acc-list{display:flex;flex-direction:column;gap:12px}
  .acc-card{background:linear-gradient(180deg,#152018,#101810);border:1px solid rgba(46,204,113,.25);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .acc-card img{width:30px;height:30px;border-radius:6px;flex-shrink:0}
  .acc-card .ac-info{flex:1;min-width:0}
  .ac-info .ac-bank{font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}
  .ac-info .ac-num{font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px;word-break:break-all}
  .ac-info .ac-holder{font-size:12px;color:var(--muted)}
  .acc-card .ac-del{background:transparent;border:1px solid var(--line);color:var(--red);border-radius:6px;font-size:12px;padding:5px 10px;cursor:pointer;flex-shrink:0}
  .acc-card .ac-del:hover{border-color:var(--red);background:rgba(192,57,43,.1)}
  .acc-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}
</style>
</head>
<body>
<header>
  <h1><span class="tag">ADMIN</span> · Удирдлагын самбар</h1>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="tables">Ширээ</button>
  <button class="tab-btn" data-tab="accounts">💳 Данс</button>
  <button class="tab-btn" data-tab="contacts">Гомдол / Санал <span class="badge" id="unread-badge" style="display:none">0</span></button>
</div>

<div id="tab-tables" class="tab-panel active">
<div class="wrap">
  <!-- All tables -->
  <div class="card">
    <h2>Бүх ширээ (<span id="tbl-count">0</span>)</h2>
    <input id="search" placeholder="Хайх..." autocomplete="off">
    <ul class="tbl-list" id="tbl-list"></ul>
    <div class="empty" id="tbl-empty">Ачааллаж байна...</div>
    <div class="row-actions">
      <button class="btn ghost" id="new-btn">+ Гараар нэмэх</button>
    </div>
    <p class="hint">Ширээ дээр дарж тоглогчдыг тохируулна. <span style="color:var(--gold)">●</span> = тохируулсан. Хажуугийн тоо нь тухайн ширээн дэх тоглогчийн тоо.</p>
  </div>

  <!-- Editor -->
  <div class="card">
    <h2>Ширээ засах</h2>
    <label>Ширээний нэр (лобби дээрхтэй яг адил)</label>
    <input id="table-name" placeholder="ж: 5K TEXAS-H" autocomplete="off" list="known-tables">
    <datalist id="known-tables"></datalist>

    <label style="margin-top:16px">Суудлууд (нэр + чип)</label>
    <div id="seats"></div>

    <div class="row-actions">
      <button class="btn save" id="save-btn">Хадгалах</button>
      <button class="btn ghost" id="clear-btn">Цэвэрлэх</button>
      <button class="btn red" id="delete-btn" style="margin-left:auto">Устгах</button>
    </div>
  </div>
</div>
</div><!-- /tab-tables -->

<div id="tab-accounts" class="tab-panel">
  <div class="acc-wrap">
    <div class="acc-form">
      <h2>Шинэ данс нэмэх</h2>
      <label>Банк сонгох</label>
      <div class="bank-picker" id="bank-picker"></div>
      <label>Дансны дугаар</label>
      <input id="acc-number" placeholder="ж: 8734159954 эсвэл MN130039..." autocomplete="off">
      <label>Данс эзэмшигч</label>
      <input id="acc-holder" placeholder="Овог нэр" autocomplete="off">
      <label>Тэмдэглэл (заавал биш)</label>
      <input id="acc-note" placeholder="ж: Голлох данс" autocomplete="off">
      <div class="row-actions">
        <button class="btn save" id="acc-add-btn">+ Данс нэмэх</button>
      </div>
    </div>
    <div id="acc-list"><div class="acc-empty">Ачааллаж байна...</div></div>
  </div>
</div>

<div id="tab-contacts" class="tab-panel">
  <div class="contacts-wrap">
    <div class="contacts-toolbar" style="flex-wrap:wrap;gap:8px">
      <button class="filter-btn active" data-filter="all">Бүгд</button>
      <button class="filter-btn" data-filter="unread">Уншаагүй</button>
      <button class="filter-btn" data-filter="VIP эрх авах">👑 VIP</button>
      <button class="filter-btn" data-filter="Оороогүй цэнэгийн хүсэлт">💳 Цэнэг</button>
      <button class="filter-btn" data-filter="Бусад хүсэлт">📋 Бусад</button>
      <button class="filter-btn" data-filter="Хүсэлтийн хариу">🔍 Хариу</button>
      <button class="btn blue" id="refresh-contacts-btn" style="margin-left:auto;padding:7px 16px;font-size:13px">↻ Шинэчлэх</button>
    </div>
    <div id="contacts-list"><div class="contacts-empty">Ачааллаж байна...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = 'hairaa_table_players';
  var SEATS = 9;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function save(obj) {
    try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function toast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = ok === false ? '#c0392b' : '#2e9e4f';
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // build seat inputs
  var seatsEl = document.getElementById('seats');
  for (var i = 0; i < SEATS; i++) {
    var row = document.createElement('div');
    row.className = 'seat-row';
    row.innerHTML =
      '<span class="num">' + (i + 1) + '</span>' +
      '<input class="s-name" placeholder="Тоглогчийн нэр" autocomplete="off">' +
      '<input class="s-stack" placeholder="Чип" inputmode="numeric" autocomplete="off">';
    seatsEl.appendChild(row);
  }
  var nameInputs  = Array.prototype.slice.call(seatsEl.querySelectorAll('.s-name'));
  var stackInputs = Array.prototype.slice.call(seatsEl.querySelectorAll('.s-stack'));
  var tableNameEl = document.getElementById('table-name');

  function fillEditor(name) {
    selected = name || '';
    tableNameEl.value = name || '';
    var cfg = (load()[name] || []);
    for (var i = 0; i < SEATS; i++) {
      nameInputs[i].value  = cfg[i] && cfg[i].name  != null ? cfg[i].name  : '';
      stackInputs[i].value = cfg[i] && cfg[i].stack != null ? cfg[i].stack : '';
    }
  }

  var ALL = [];          // [{name, players, stakes, game}] from tables.json
  var selected = '';

  function renderList() {
    var cfgs = load();
    var q = (document.getElementById('search').value || '').toLowerCase();
    var ul = document.getElementById('tbl-list');
    var empty = document.getElementById('tbl-empty');
    var dl = document.getElementById('known-tables');
    ul.innerHTML = '';
    dl.innerHTML = '';

    // union of lobby tables + any configured-only tables not in the lobby
    var list = ALL.slice();
    var known = {};
    ALL.forEach(function (t) { known[t.name] = 1; });
    Object.keys(cfgs).forEach(function (nm) {
      if (!known[nm]) list.push({ name: nm, players: '', stakes: '', game: '' });
    });

    var shown = list.filter(function (t) { return t.name.toLowerCase().indexOf(q) >= 0; });
    empty.style.display = shown.length ? 'none' : 'block';
    empty.textContent = ALL.length ? 'Илэрц алга.' : 'Ачааллаж байна...';

    shown.forEach(function (t) {
      var configured = !!cfgs[t.name];
      var li = document.createElement('li');
      if (t.name === selected) li.className = 'active';
      li.innerHTML =
        '<span class="nm">' + (configured ? '<span class="dot">●</span>' : '') +
          '<span>' + t.name + '</span></span>' +
        (t.players ? '<span class="plrs">' + t.players + '</span>' : '');
      li.addEventListener('click', function () { selected = t.name; fillEditor(t.name); renderList(); });
      ul.appendChild(li);
      dl.appendChild(Object.assign(document.createElement('option'), { value: t.name }));
    });
    document.getElementById('tbl-count').textContent = list.length;
  }

  // Load the full lobby table list.
  fetch('tables.json')
    .then(function (r) { return r.json(); })
    .then(function (data) { ALL = data || []; renderList(); })
    .catch(function () { renderList(); });

  document.getElementById('search').addEventListener('input', renderList);

  document.getElementById('save-btn').addEventListener('click', function () {
    var name = tableNameEl.value.trim();
    if (!name) { toast('Ширээний нэр оруулна уу', false); return; }
    var players = [];
    for (var i = 0; i < SEATS; i++) {
      var nm = nameInputs[i].value.trim();
      var st = parseInt((stackInputs[i].value || '').replace(/[^\d]/g, ''), 10);
      players.push(nm ? { name: nm, stack: isNaN(st) ? null : st } : null);
    }
    var all = load(); all[name] = players; save(all);
    renderList();
    toast('Хадгаллаа: ' + name);
  });

  document.getElementById('delete-btn').addEventListener('click', function () {
    var name = tableNameEl.value.trim();
    if (!name) return;
    var all = load();
    if (all[name]) { delete all[name]; save(all); renderList(); toast('Устгалаа'); }
    fillEditor('');
  });

  document.getElementById('clear-btn').addEventListener('click', function () { fillEditor(tableNameEl.value.trim()); });
  document.getElementById('new-btn').addEventListener('click', function () { fillEditor(''); tableNameEl.focus(); });
  tableNameEl.addEventListener('change', function () { fillEditor(tableNameEl.value.trim()); });

  renderList();
})();

/* ── Tab switching ── */
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab-btn'));
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabs.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var target = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      document.getElementById('tab-' + target).classList.add('active');
      if (target === 'contacts') loadContacts();
      if (target === 'accounts') loadAccounts();
    });
  });
})();

/* ── Accounts (Данс) ── */
(function () {
  var BANKS = [
    { name: 'Голомт банк', logo: 'assets/banks/golomt.jpg' },
    { name: 'Хас банк',    logo: 'assets/banks/xac.jpg' },
    { name: 'Хаан банк',   logo: 'assets/banks/khan.jpg' },
    { name: 'Богд банк',   logo: 'assets/banks/bogd.jpg' },
    { name: 'М банк',      logo: 'assets/banks/mbank.png' },
    { name: 'ХХБ (TDB)',   logo: 'assets/banks/tdb.jpg' },
    { name: 'Төрийн банк', logo: 'assets/banks/state.jpg' },
  ];
  var selectedBank = BANKS[0].name;

  function getAdminKey() {
    var k = sessionStorage.getItem('admin_key');
    if (!k) { k = prompt('Admin түлхүүр оруулна уу:') || ''; if (k) sessionStorage.setItem('admin_key', k); }
    return k;
  }
  function toast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = ok === false ? '#c0392b' : '#2e9e4f';
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function logoForBank(name) {
    for (var i = 0; i < BANKS.length; i++) if (BANKS[i].name === name) return BANKS[i].logo;
    return null;
  }

  var pickerEl = document.getElementById('bank-picker');
  pickerEl.innerHTML = BANKS.map(function (b, i) {
    return '<div class="bank-opt' + (i === 0 ? ' selected' : '') + '" data-bank="' + escHtml(b.name) + '">' +
      '<img src="' + b.logo + '" alt="">' +
      '<span>' + b.name + '</span>' +
    '</div>';
  }).join('');
  pickerEl.querySelectorAll('.bank-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      pickerEl.querySelectorAll('.bank-opt').forEach(function (o) { o.classList.remove('selected'); });
      opt.classList.add('selected');
      selectedBank = opt.getAttribute('data-bank');
    });
  });

  function renderAccounts(list) {
    var el = document.getElementById('acc-list');
    if (!list || !list.length) { el.innerHTML = '<div class="acc-empty">Данс байхгүй байна.</div>'; return; }
    el.innerHTML = '<div class="acc-list">' + list.map(function (a) {
      var logo = logoForBank(a.bank);
      return '<div class="acc-card">' +
        (logo ? '<img src="' + logo + '" alt="">' : '') +
        '<div class="ac-info">' +
          '<div class="ac-bank">' + escHtml(a.bank) + '</div>' +
          '<div class="ac-num">' + escHtml(a.number) + '</div>' +
          (a.holder ? '<div class="ac-holder">👤 ' + escHtml(a.holder) + '</div>' : '') +
        '</div>' +
        '<button class="ac-del" data-id="' + a.id + '">🗑</button>' +
      '</div>';
    }).join('') + '</div>';
    el.querySelectorAll('.ac-del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('Энэ дансыг устгах уу?')) return;
        deleteAccount(+btn.getAttribute('data-id'));
      });
    });
  }

  function loadAccounts() {
    var key = getAdminKey();
    fetch('/api/accounts?key=' + encodeURIComponent(key))
      .then(function (r) { return r.json(); })
      .then(renderAccounts)
      .catch(function () { document.getElementById('acc-list').innerHTML = '<div class="acc-empty" style="color:var(--red)">Серверт холбогдсонгүй.</div>'; });
  }

  function deleteAccount(id) {
    var key = getAdminKey();
    fetch('/api/accounts?key=' + encodeURIComponent(key), {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(loadAccounts);
  }

  document.getElementById('acc-add-btn').addEventListener('click', function () {
    var number = document.getElementById('acc-number').value.trim();
    var holder = document.getElementById('acc-holder').value.trim();
    var note   = document.getElementById('acc-note').value.trim();
    if (!number) { toast('Дансны дугаар оруулна уу', false); return; }
    var key = getAdminKey();
    fetch('/api/accounts?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bank: selectedBank, number: number, holder: holder, note: note })
    }).then(function (r) {
      if (!r.ok) { toast('Алдаа гарлаа', false); return; }
      document.getElementById('acc-number').value = '';
      document.getElementById('acc-holder').value = '';
      document.getElementById('acc-note').value = '';
      loadAccounts();
      toast('Данс нэмэгдлээ');
    });
  });
})();

/* ── Contacts ── */
(function () {
  var allContacts = [];
  var currentFilter = 'all';

  function getAdminKey() {
    var k = sessionStorage.getItem('admin_key');
    if (!k) {
      k = prompt('Admin түлхүүр оруулна уу:') || '';
      if (k) sessionStorage.setItem('admin_key', k);
    }
    return k;
  }

  function kindColor(kind) {
    var map = {
      'VIP эрх авах': '#d4ac0d',
      'Оороогүй цэнэгийн хүсэлт': '#e74c3c',
      'Бусад хүсэлт': '#9b59b6',
      'Хүсэлтийн хариу': '#27ae60',
      'Гомдол': '#e74c3c', 'Санал': '#3498db', 'Асуулт': '#f39c12', 'Алдааны мэдэгдэл': '#9b59b6'
    };
    return map[kind] || '#4db6e8';
  }

  function renderContacts() {
    var list = currentFilter === 'unread'
      ? allContacts.filter(function (c) { return !c.read; })
      : (currentFilter === 'all'
        ? allContacts
        : allContacts.filter(function (c) { return c.kind === currentFilter; }));
    var el = document.getElementById('contacts-list');
    if (!list.length) {
      var msg = currentFilter === 'unread' ? 'Уншаагүй мэдэгдэл алга.'
              : currentFilter === 'all' ? 'Мэдэгдэл алга.'
              : '"' + currentFilter + '" ангиллын мэдэгдэл алга.';
      el.innerHTML = '<div class="contacts-empty">' + msg + '</div>';
      return;
    }
    el.innerHTML = list.map(function (c) {
      return '<div class="contact-card' + (c.read ? '' : ' unread') + '" data-id="' + c.id + '">' +
        '<div class="cc-head">' +
          '<span class="cc-kind" style="background:' + kindColor(c.kind) + ';color:#fff">' + c.kind + '</span>' +
          '<span class="cc-name">' + escHtml(c.name) + '</span>' +
          '<span class="cc-time">' + c.time + '</span>' +
        '</div>' +
        '<div class="cc-msg">' + escHtml(c.message) + '</div>' +
        '<div class="cc-ip">IP: ' + c.ip + '</div>' +
        (!c.read ? '<button class="cc-read-btn" data-id="' + c.id + '">✓ Уншсан</button>' : '') +
      '</div>';
    }).join('');
    el.querySelectorAll('.cc-read-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { markRead(+btn.getAttribute('data-id')); });
    });
    var unread = allContacts.filter(function (c) { return !c.read; }).length;
    var badge = document.getElementById('unread-badge');
    badge.textContent = unread;
    badge.style.display = unread ? '' : 'none';
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function loadContacts() {
    var key = getAdminKey();
    fetch('/api/contacts?key=' + encodeURIComponent(key))
      .then(function (r) {
        if (r.status === 403) { sessionStorage.removeItem('admin_key'); document.getElementById('contacts-list').innerHTML = '<div class="contacts-empty" style="color:#e74c3c">Нэвтрэх эрх алга.</div>'; return null; }
        return r.json();
      })
      .then(function (data) { if (data) { allContacts = data; renderContacts(); } })
      .catch(function () { document.getElementById('contacts-list').innerHTML = '<div class="contacts-empty" style="color:#e74c3c">Серверт холбогдсонгүй.</div>'; });
  }

  function markRead(id) {
    var key = getAdminKey();
    fetch('/api/contacts?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    }).then(function () {
      allContacts.forEach(function (c) { if (c.id === id) c.read = true; });
      renderContacts();
    });
  }

  document.getElementById('refresh-contacts-btn').addEventListener('click', loadContacts);
  document.querySelectorAll('.filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      renderContacts();
    });
  });
})();
</script>
</body>
</html>
